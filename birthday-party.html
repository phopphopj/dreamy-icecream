<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>birthday party — dreamy icecream</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="index.html#home">
        <img class="brand-mark" src="assets/logo.jpg" alt="dreamy icecream logo" />
        <span class="brand-text">dreamy icecream</span>
      </a>

      <nav class="nav">
        <a href="index.html#home">home</a>
        <a href="index.html#flavors">flavors</a>
        <a href="index.html#menu">menu</a>
        <a href="index.html#order" class="nav-cta">order</a>
      </nav>
    </div>
  </header>

  <main class="flavor-page-main">
    <section class="birthday-hero">
      <div class="container birthday-layout">

        <div class="birthday-photo-card">
          <img src="assets/birthday_party.jpg" alt="birthday party ice cream">
        </div>

        <div class="birthday-info-card">
          <span class="pill pill-purple">limited flavor</span>
          <h1>birthday party 🎂</h1>
          <p class="lead">vanilla ice cream with colorful sprinkles.</p>

          <p>
            sweet, creamy, colorful, and made to feel like a mini celebration
            in every cup.
          </p>

          <div class="birthday-buttons">
            <a class="btn btn-primary" href="index.html#order">order now</a>
            <a class="btn btn-ghost" href="index.html#flavors">back to flavors</a>
          </div>
        </div>

      </div>
    </section>
  </main>
</body>
</html>
